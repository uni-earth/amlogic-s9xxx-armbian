name: Compile Kernel with BTF

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: "Kernel version"
        required: true
        default: "6.6.y"
        type: choice
        options:
          - 6.6.y
          - 6.1.y
          - 6.12.y
      kernel_sign:
        description: "Kernel signature"
        required: false
        default: "-btf"
        type: string

jobs:
  compile:
    runs-on: ubuntu-24.04-arm
    steps:
      # 关键修复：action 的 kernel_config 是从本仓库工作区读文件的。
      # 没有 checkout 时 ${{ github.workspace }} 是空目录，kernel-config/btf/config-*
      # 永远找不到，action 打印一行提示后静默回退官方精简配置（无 DEBUG_INFO_BTF）。
      - name: Checkout
        uses: actions/checkout@v4

      # 前置校验：配置缺失或未开 BTF 时直接失败，避免再次"编译成功但没 BTF"。
      - name: Sanity check BTF config
        env:
          KERNEL_VERSION: ${{ inputs.kernel_version }}
        run: |
          series="${KERNEL_VERSION%.y}"
          cfg="compile-kernel/btf/config-${series}"
          test -s "${cfg}" || { echo "::error::${cfg} 不存在，请确认 fork 中已创建该文件"; exit 1; }
          grep -q "^CONFIG_DEBUG_INFO_BTF=y" "${cfg}" || { echo "::error::${cfg} 未启用 CONFIG_DEBUG_INFO_BTF"; exit 1; }
          echo "config OK: ${cfg}"

      - name: Compile the kernel
        uses: ophub/amlogic-s9xxx-armbian@main
        with:
          build_target: kernel
          kernel_version: ${{ inputs.kernel_version }}
          kernel_auto: true
          kernel_sign: ${{ inputs.kernel_sign }}
          docker_image: ophub/armbian-trixie:arm64
          kernel_config: compile-kernel/btf

      # 产物校验（已逐行核实编译脚本）：编译用的 .config 由 compile_env 从
      # tools/config 拷入内核源码目录 linux-<x.y>.y/.config，且 delete_source 默认
      # false（源码保留）→ 该文件编译后必在；boot-*.tar.gz 内也含 config-* 作兜底。
      - name: Verify BTF in built kernel
        run: |
          cfg="$(find "${{ env.PACKAGED_OUTPUTPATH }}/../kernel" -maxdepth 2 -type f -name '.config' 2>/dev/null | head -n1)"
          if [[ -n "${cfg}" ]] && grep -q "^CONFIG_DEBUG_INFO_BTF=y" "${cfg}"; then
            echo "BTF OK: ${cfg}"
            exit 0
          fi
          boot_pkg="$(find "${{ env.PACKAGED_OUTPUTPATH }}" -name 'boot-*.tar.gz' 2>/dev/null | head -n1)"
          if [[ -n "${boot_pkg}" ]]; then
            tmpd="$(mktemp -d)"
            tar -xzf "${boot_pkg}" -C "${tmpd}" 2>/dev/null
            cfg2="$(find "${tmpd}" -type f -name 'config-*' | head -n1)"
            rm -rf "${tmpd}"
            if [[ -n "${cfg2}" ]] && grep -q "^CONFIG_DEBUG_INFO_BTF=y" "${cfg2}"; then
              echo "BTF OK (boot package): ${boot_pkg}"
              exit 0
            fi
          fi
          echo "::error::内核配置无 BTF（源码 .config 与 boot 包均未检出 CONFIG_DEBUG_INFO_BTF=y）"
          exit 1

      - name: Upload Kernel to Release
        if: ${{ success() && env.PACKAGED_STATUS == 'success' }}
        uses: ncipollo/release-action@v1
        with:
          tag: kernel-btf
          name: Kernel with BTF ${{ inputs.kernel_version }}
          artifacts: ${{ env.PACKAGED_OUTPUTPATH }}/*
          allowUpdates: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            带 BTF 支持的 6.6 内核，用于 daed。
            签名：${{ inputs.kernel_sign }}
