name: Compile Kernel with BTF

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: "Kernel version"
        required: true
        default: "6.6.y"
        type: choice
        options:
          - 6.6.y
          - 6.1.y
          - 6.12.y
      kernel_sign:
        description: "Kernel signature"
        required: false
        default: "-btf"
        type: string

jobs:
  compile:
    runs-on: ubuntu-24.04-arm                    # 使用 ARM runner，避免架构问题
    steps:
      - name: Compile the kernel
        uses: uni-earth/amlogic-s9xxx-armbian@main
        with:
          build_target: kernel
          kernel_version: ${{ inputs.kernel_version }}
          kernel_auto: true
          kernel_sign: ${{ inputs.kernel_sign }}
          docker_image: ophub/armbian-trixie:arm64
          kernel_config: kernel-config/btf         # ← 指向你放 config-6.6 的目录
